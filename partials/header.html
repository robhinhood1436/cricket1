<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{DESCRIPTION}}">
  <title>{{TITLE}}</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    (() => { try { const item = JSON.parse(sessionStorage.getItem("aj-cricket-transition")); if (item && Date.now() - item.startedAt < 6000 && new URL(item.destination, location.href).href === location.href) document.documentElement.classList.add("page-transition-incoming"); } catch (error) {} })();
  </script>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/theme.css">
  <script src="js/vendor/gsap.min.js" defer></script>
  <script src="js/vendor/ScrollTrigger.min.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/cursor.js" defer></script>
  <script src="js/animations.js" defer></script>
  <script src="js/transitions.js" defer></script>
  <script src="js/contact.js" defer></script>
</head>
<body{{BODY_CLASS}}>
  <div class="page-transition-layer" id="page-transition-layer" aria-hidden="true"><span class="page-transition-ball-wrap"><span class="page-transition-ball-streak"></span><span class="page-transition-ball"></span></span></div>
  <button class="back-to-top" type="button" aria-label="Back to top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 15l-6-6-6 6"/></svg></button>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html" aria-label="AJAY Cricket Academy home"><span>AJAY</span> Cricket Academy</a>
      <nav class="site-nav" id="site-nav" aria-label="Primary navigation">
        <a class="mask-link" data-id="Home" href="index.html"{{ACTIVE_HOME}}><span>Home</span><i class="nav-dot" aria-hidden="true"></i></a>
        <a class="mask-link" data-id="Academy" href="academy.html"{{ACTIVE_ACADEMY}}><span>Academy</span><i class="nav-dot" aria-hidden="true"></i></a>
        <a class="mask-link" data-id="Programs" href="programs.html"{{ACTIVE_PROGRAMS}}><span>Programs</span><i class="nav-dot" aria-hidden="true"></i></a>
        <a class="mask-link" data-id="Coaches" href="coaches.html"{{ACTIVE_COACHES}}><span>Coaches</span><i class="nav-dot" aria-hidden="true"></i></a>
        <a class="mask-link" data-id="Gallery" href="gallery.html"{{ACTIVE_GALLERY}}><span>Gallery</span><i class="nav-dot" aria-hidden="true"></i></a>
        <a class="mask-link" data-id="Contact" href="contact.html"{{ACTIVE_CONTACT}}><span>Contact</span><i class="nav-dot" aria-hidden="true"></i></a>
      </nav>
      <div class="nav-actions">
        <button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false"><span class="theme-toggle__icon" aria-hidden="true"><i class="theme-rays"></i><i class="theme-stars"></i></span></button>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
      </div>
    </div>
  </header>
